name: NEW APP v2
on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create project
        run: |
          mkdir -p app/src/main/java/ir/bot/control app/src/main/assets

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "BotControl"
          include ":app"
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id "com.android.application" version "8.7.3" }
          android {
              namespace "ir.bot.control"
              compileSdk 34
              defaultConfig {
                  applicationId "ir.bot.control"
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "2.0"
              }
          }
          tasks.withType(JavaCompile).configureEach { options.encoding = "UTF-8" }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="com.termux.permission.RUN_COMMAND" />
              <queries><package android:name="com.termux" /></queries>
              <application
                  android:label="کنترل ربات"
                  android:icon="@android:drawable/ic_lock_power_off"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/ir/bot/control/MainActivity.java <<'EOF'
          package ir.bot.control;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.text.InputType;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import java.io.ByteArrayOutputStream;
          import java.io.IOException;
          import java.io.InputStream;

          public class MainActivity extends Activity {
              private static final String PERMISSION = "com.termux.permission.RUN_COMMAND";
              // $1 = control.py, $2 = start | stop | room, $3 = room id
              private static final String SHELL =
                  "[ \"$2\" = stop ] || termux-wake-lock\n"
                  + "proot-distro login ubuntu -- python3 -c \"$1\" \"$2\" \"$3\"\n"
                  + "[ \"$2\" != stop ] || termux-wake-unlock\n";

              private TextView status;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  LinearLayout page = new LinearLayout(this);
                  page.setOrientation(LinearLayout.VERTICAL);
                  page.setGravity(Gravity.CENTER);
                  page.setBackgroundColor(Color.rgb(23, 18, 58));
                  page.setPadding(60, 60, 60, 60);

                  TextView title = text("کنترل ربات هایرایز", 24);
                  status = text("یک دکمه را بزن", 16);
                  page.addView(title);
                  page.addView(button("روشن کردن ربات", Color.rgb(35, 170, 110), new View.OnClickListener() {
                      public void onClick(View v) { run("start", "", "فرمان روشن شدن فرستاده شد. چند ثانیه صبر کن."); }
                  }));
                  page.addView(button("خاموش کردن ربات", Color.rgb(210, 60, 80), new View.OnClickListener() {
                      public void onClick(View v) { run("stop", "", "فرمان خاموش شدن فرستاده شد."); }
                  }));
                  page.addView(button("تغییر روم بات", Color.rgb(60, 105, 220), new View.OnClickListener() {
                      public void onClick(View v) { askRoom(); }
                  }));
                  page.addView(status);
                  setContentView(page);
              }

              private void askRoom() {
                  final EditText input = new EditText(this);
                  input.setHint("https://high.rs/...");
                  input.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_URI);
                  input.setTextDirection(View.TEXT_DIRECTION_LTR);
                  input.setSingleLine(true);
                  final AlertDialog dialog = new AlertDialog.Builder(this)
                      .setTitle("لینک روم جدید")
                      .setMessage("لینک روم را اینجا بچسبان و تأیید را بزن.")
                      .setView(input)
                      .setPositiveButton("تأیید", null)
                      .setNegativeButton("لغو", null)
                      .create();
                  dialog.show();
                  // پنل فقط وقتی لینک درست باشد بسته می‌شود
                  dialog.getButton(AlertDialog.BUTTON_POSITIVE).setOnClickListener(new View.OnClickListener() {
                      public void onClick(View v) {
                          String room = RoomLink.id(input.getText().toString());
                          if (room == null) {
                              input.setError("لینک روم درست نیست");
                              return;
                          }
                          dialog.dismiss();
                          run("room", room, "بات دارد به روم جدید می‌رود. حدود ۱۵ ثانیه صبر کن.\n"
                              + "بات باید در آن روم دسترسی Designer داشته باشد.");
                      }
                  });
              }

              private TextView text(String value, int size) {
                  TextView view = new TextView(this);
                  view.setText(value);
                  view.setTextSize(size);
                  view.setTextColor(Color.WHITE);
                  view.setGravity(Gravity.CENTER);
                  view.setPadding(0, 30, 0, 30);
                  return view;
              }

              private Button button(String label, int color, View.OnClickListener action) {
                  Button view = new Button(this);
                  view.setText(label);
                  view.setTextSize(20);
                  view.setTextColor(Color.WHITE);
                  view.setBackgroundColor(color);
                  LinearLayout.LayoutParams size = new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, 200);
                  size.setMargins(0, 20, 0, 20);
                  view.setLayoutParams(size);
                  view.setOnClickListener(action);
                  return view;
              }

              private String controlScript() throws IOException {
                  InputStream in = getAssets().open("control.py");
                  try {
                      ByteArrayOutputStream out = new ByteArrayOutputStream();
                      byte[] buffer = new byte[4096];
                      int count;
                      while ((count = in.read(buffer)) > 0) out.write(buffer, 0, count);
                      return out.toString("UTF-8");
                  } finally {
                      in.close();
                  }
              }

              private void run(String action, String room, String done) {
                  if (checkSelfPermission(PERMISSION) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{PERMISSION}, 1);
                      status.setText("اجازهٔ اجرای فرمان در Termux را بده و دوباره بزن.");
                      return;
                  }
                  try {
                      Intent intent = new Intent("com.termux.RUN_COMMAND");
                      intent.setClassName("com.termux", "com.termux.app.RunCommandService");
                      intent.putExtra("com.termux.RUN_COMMAND_PATH",
                          "/data/data/com.termux/files/usr/bin/bash");
                      intent.putExtra("com.termux.RUN_COMMAND_ARGUMENTS",
                          new String[]{"-c", SHELL, "bot", controlScript(), action, room});
                      intent.putExtra("com.termux.RUN_COMMAND_BACKGROUND", true);
                      Object found = Build.VERSION.SDK_INT >= 26
                          ? startForegroundService(intent) : startService(intent);
                      status.setText(found != null ? done : "Termux پیدا نشد.");
                  } catch (Exception error) {
                      status.setText("خطا: " + error.getMessage());
                  }
              }
          }
          EOF

          cat > app/src/main/java/ir/bot/control/RoomLink.java <<'EOF'
          package ir.bot.control;

          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          /** شناسهٔ روم را از لینک بیرون می‌کشد. */
          final class RoomLink {
              private static final String ID = "([0-9a-fA-F]{24})(?![0-9a-fA-F])";
              private static final Pattern[] FORMS = {
                  Pattern.compile("[?&]ownedRoomId=" + ID),
                  Pattern.compile("/room\\?(?:\\S*?&)?id=" + ID),
                  Pattern.compile("^" + ID + "$"),
              };

              static String id(String input) {
                  String text = input.trim();
                  for (Pattern form : FORMS) {
                      Matcher found = form.matcher(text);
                      if (found.find()) return found.group(1).toLowerCase(java.util.Locale.ROOT);
                  }
                  return null;
              }
          }
          EOF

          cat > app/src/main/assets/control.py <<'EOF'
          import json
          import os
          import re
          import signal
          import sys
          import time

          ROOT = "/root/highrise_bot"
          # these belong to one room, so they are kept separately for each room
          ROOM_KEYS = {"bot_position": None, "spots": {}, "spawn": None, "dancefloor": None}


          def bot_pids():
              found = []
              for pid in os.listdir("/proc"):
                  if not pid.isdigit() or int(pid) == os.getpid():
                      continue
                  try:
                      with open("/proc/" + pid + "/cmdline", "rb") as f:
                          argv = f.read().split(b"\0")
                  except OSError:
                      continue
                  if b"run.py" in argv and any(b"python" in a for a in argv):
                      found.append(int(pid))
              return found


          def stop():
              for sig in (signal.SIGINT, signal.SIGKILL):
                  for pid in bot_pids():
                      try:
                          os.kill(pid, sig)
                      except OSError:
                          pass
                  for _ in range(50):
                      if not bot_pids():
                          break
                      time.sleep(0.1)
              if os.path.exists("bot.pid"):
                  os.remove("bot.pid")


          def start():
              if bot_pids():
                  return
              log = os.open("bot.log", os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
              os.dup2(log, 1)
              os.dup2(log, 2)
              with open("bot.pid", "w") as f:
                  f.write(str(os.getpid()))
              os.environ["PYTHONUNBUFFERED"] = "1"
              os.execv("venv/bin/python", ["venv/bin/python", "run.py"])


          def set_room(new):
              with open("config.json", encoding="utf-8") as f:
                  cfg = json.load(f)
              old = cfg.get("room_id")
              if old == new:
                  return
              if os.path.exists("bot.db"):
                  sys.path.insert(0, ROOT)
                  from core.db import DB
                  db = DB("bot.db")
                  saved = db.get("room_data", {})
                  saved[old] = {k: db.get(k, d) for k, d in ROOM_KEYS.items()}
                  for key, default in ROOM_KEYS.items():
                      db.put(key, saved.get(new, {}).get(key, default))
                  db.put("room_data", saved)
              cfg["room_id"] = new
              with open("config.json.tmp", "w", encoding="utf-8") as f:
                  json.dump(cfg, f, ensure_ascii=False, indent=2)
              os.replace("config.json.tmp", "config.json")


          def main():
              action, room = sys.argv[1], sys.argv[2]
              os.chdir(ROOT)
              if action == "room":
                  if not re.fullmatch("[0-9a-f]{24}", room):
                      sys.exit("bad room id")
                  stop()
                  set_room(room)
                  start()
              elif action == "start":
                  start()
              elif action == "stop":
                  stop()


          main()
          EOF

      - name: Build
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: BotControl-v2
          path: app/build/outputs/apk/debug/app-debug.apk
